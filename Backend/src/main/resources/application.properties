spring.application.name=zona-bikers-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/zona_bikers}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jackson.deserialization.accept-float-as-int=false
app.jwt.secret=${JWT_SECRET}
app.jwt.minutes=${JWT_MINUTES:60}
app.cors.origins=${FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.bootstrap.email=${ADMIN_EMAIL:}
app.bootstrap.password=${ADMIN_PASSWORD:}
app.seed.catalog=${SEED_CATALOG:true}
